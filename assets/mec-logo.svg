<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="mecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Left Emblem / Crest -->
  <g transform="translate(45, 10)">
    <!-- Outer Shield / Circle -->
    <circle cx="50" cy="50" r="46" fill="url(#mecGrad)" stroke="#d97706" stroke-width="3"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- Torch & Flame Motif -->
    <path d="M50 20 Q54 28 50 36 Q46 28 50 20 Z" fill="url(#goldGrad)"/>
    <path d="M46 36 L54 36 L52 48 L48 48 Z" fill="#fef3c7"/>
    
    <!-- Open Book Motif -->
    <path d="M30 62 Q50 56 50 68 Q50 56 70 62 L70 76 Q50 70 50 82 Q50 70 30 76 Z" fill="#ffffff" stroke="#0a2540" stroke-width="1.5"/>
    <line x1="50" y1="68" x2="50" y2="82" stroke="#0a2540" stroke-width="1.5"/>
    <line x1="34" y1="67" x2="47" y2="65" stroke="#94a3b8" stroke-width="1"/>
    <line x1="34" y1="71" x2="47" y2="69" stroke="#94a3b8" stroke-width="1"/>
    <line x1="53" y1="65" x2="66" y2="67" stroke="#94a3b8" stroke-width="1"/>
    <line x1="53" y1="69" x2="66" y2="71" stroke="#94a3b8" stroke-width="1"/>

    <!-- Gear / Engineering Cog Accent -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Estd banner -->
    <rect x="32" y="84" width="36" height="8" rx="2" fill="#d97706"/>
    <text x="50" y="90.5" font-family="'Times New Roman', Georgia, serif" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ESTD 2000</text>
  </g>

  <!-- Typography Content -->
  <!-- Institution Name -->
  <text x="440" y="44" font-family="'Times New Roman', Georgia, serif" font-size="24" font-weight="bold" fill="#0a2540" text-anchor="middle" letter-spacing="1.2">
    MUTHAYAMMAL ENGINEERING COLLEGE
  </text>
  
  <!-- Autonomous Status Badge / Subtitle -->
  <text x="440" y="68" font-family="'Times New Roman', Georgia, serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle" letter-spacing="0.8">
    (An Autonomous Institution)
  </text>

  <!-- Accreditation & Affiliation -->
  <text x="440" y="86" font-family="'Times New Roman', Georgia, serif" font-size="11.5" fill="#334155" text-anchor="middle">
    Approved by AICTE, New Delhi &amp; Affiliated to Anna University, Chennai
  </text>

  <!-- Location Details -->
  <text x="440" y="103" font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Rasipuram – 637 408, Namakkal (Dt.), Tamil Nadu, India.
  </text>

  <!-- Subtle divider line -->
  <line x1="160" y1="112" x2="720" y2="112" stroke="#d97706" stroke-width="1.5"/>
</svg>
